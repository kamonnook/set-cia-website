<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img"
     aria-label="SET global partnerships: 16 MOU and MOA agreements with 15 partner universities in 11 countries; 13 active; 8 new agreements signed in 2024 to 2025.">
  <defs>
    <linearGradient id="purple3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93233a"/>
      <stop offset="1" stop-color="#54101a"/>
    </linearGradient>
    <style>
      text { font-family: "Inter","Segoe UI","Helvetica Neue",Arial,"Sukhumvit Set","Sarabun",Tahoma,sans-serif; }
      .num2{font-size:52px;font-weight:800;fill:#d0691c}
      .lab2{font-size:18px;font-weight:700;fill:#7a1c2a}
      .th{font-size:14px;fill:#5a6b78}
      .hh{font-size:23px;font-weight:700;fill:#1a2530}
      .reg{font-size:16px;font-weight:600;fill:#1a2530}
      .val{font-size:18px;font-weight:700;fill:#7a1c2a}
      .hv{font-size:52px;font-weight:800;fill:#d0691c}
      .hl{font-size:17px;font-weight:600;fill:#1a2530}
      .hls{font-size:15px;fill:#5a6b78}
      .ttl{font-size:37px;font-weight:800;fill:#fff}
      .sub{font-size:17px;fill:#f2dde1}
      .subth{font-size:14px;fill:#ddb9c1}
      .badge{font-size:24px;font-weight:800;fill:#fff}
      .pill{font-size:15px;font-weight:600;fill:#fff}
      .ribbon{font-size:16px;fill:#5a6b78}
      .foot{font-size:13px;fill:#5a6b78}
      .footr{font-size:13px;font-weight:600;fill:#7a1c2a}
    </style>
  </defs>

  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- header -->
  <rect width="1200" height="150" fill="url(#purple3)"/>
  <circle cx="95" cy="75" r="44" fill="#d0691c" stroke="#a8500f" stroke-width="2"/>
  <text x="95" y="83" text-anchor="middle" class="badge">SET</text>
  <text x="165" y="60" class="ttl">SET Global Partnerships — MOU / MOA</text>
  <text x="165" y="90" class="sub">School of Engineering &amp; Technology · Walailak University</text>
  <text x="165" y="114" class="subth">เครือข่ายความร่วมมือ MOU / MOA · สำนักวิชาวิศวกรรมศาสตร์และเทคโนโลยี</text>
  <rect x="905" y="46" width="235" height="36" rx="18" fill="rgba(255,255,255,0.14)" stroke="#d0691c" stroke-width="1.5"/>
  <text x="1022" y="70" text-anchor="middle" class="pill">Register · 2015 – 2025</text>

  <!-- stat tiles -->
  <g>
    <rect x="60"  y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="335" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="610" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="885" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>

    <text x="187"  y="272" text-anchor="middle" class="num2">16</text>
    <text x="187"  y="306" text-anchor="middle" class="lab2">MOU / MOA agreements</text>
    <text x="187"  y="330" text-anchor="middle" class="th">ข้อตกลงความร่วมมือ</text>

    <text x="462"  y="272" text-anchor="middle" class="num2">15</text>
    <text x="462"  y="306" text-anchor="middle" class="lab2">Partner universities</text>
    <text x="462"  y="330" text-anchor="middle" class="th">มหาวิทยาลัยพันธมิตร</text>

    <text x="737"  y="272" text-anchor="middle" class="num2">11</text>
    <text x="737"  y="306" text-anchor="middle" class="lab2">Countries</text>
    <text x="737"  y="330" text-anchor="middle" class="th">ประเทศ</text>

    <text x="1012" y="272" text-anchor="middle" class="num2">13</text>
    <text x="1012" y="306" text-anchor="middle" class="lab2">Active agreements</text>
    <text x="1012" y="330" text-anchor="middle" class="th">ฉบับที่มีผลอยู่</text>
  </g>

  <!-- left: agreements by region -->
  <text x="60" y="398" class="hh">By region <tspan class="th" font-size="16"> ·  ตามภูมิภาค</tspan></text>

  <text x="60" y="451" class="reg">East Asia</text>
  <rect x="250" y="430" width="330" height="30" rx="6" fill="#d0691c"/>
  <text x="594" y="451" class="val">6</text>

  <text x="60" y="499" class="reg">Europe</text>
  <rect x="250" y="478" width="330" height="30" rx="6" fill="#d0691c"/>
  <text x="594" y="499" class="val">6</text>

  <text x="60" y="547" class="reg">Southeast Asia</text>
  <rect x="250" y="526" width="165" height="30" rx="6" fill="#7a1c2a"/>
  <text x="429" y="547" class="val">3</text>

  <text x="60" y="595" class="reg">South Asia</text>
  <rect x="250" y="574" width="55" height="30" rx="6" fill="#7a1c2a"/>
  <text x="319" y="595" class="val">1</text>

  <!-- right: by status -->
  <text x="650" y="398" class="hh">By status <tspan class="th" font-size="16"> ·  สถานะ</tspan></text>

  <text x="650" y="451" class="reg">Active</text>
  <rect x="830" y="430" width="260" height="30" rx="6" fill="#2e8b57"/>
  <text x="1104" y="451" class="val">13</text>

  <text x="650" y="499" class="reg">Applied (Erasmus+)</text>
  <rect x="830" y="478" width="20" height="30" rx="6" fill="#a8515f"/>
  <text x="864" y="499" class="val">1</text>

  <text x="650" y="547" class="reg">Expired</text>
  <rect x="830" y="526" width="40" height="30" rx="6" fill="#b4b2a9"/>
  <text x="884" y="547" class="val">2</text>

  <!-- momentum callout -->
  <rect x="60" y="622" width="1080" height="66" rx="12" fill="rgba(122,28,42,0.06)" stroke="rgba(122,28,42,0.20)"/>
  <text x="95" y="668" class="hv">8</text>
  <text x="145" y="652" class="hl">new agreements signed in 2024 – 2025 — the network's fastest growth yet</text>
  <text x="145" y="678" class="hls">ข้อตกลงใหม่ที่ลงนามช่วงปี 2024–2025 · จาก Erasmus+ ในยุโรป ถึงหลักสูตรปริญญาคู่กับจีน</text>

  <!-- country ribbon -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="750" text-anchor="middle" class="ribbon">Malaysia · Japan · China · Taiwan · India · Turkey · Germany · Poland · Slovakia · Hungary · Austria</text>

  <!-- footer -->
  <rect x="0" y="774" width="1200" height="56" fill="#faf8fc"/>
  <line x1="0" y1="774" x2="1200" y2="774" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="808" class="foot">Source: List of MOU / MOA with SET — school partnership register (status as recorded)</text>
  <text x="1140" y="808" text-anchor="end" class="footr">SET · Walailak University</text>
</svg>
