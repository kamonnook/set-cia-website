<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img"
     aria-label="SET international activity, October 2024 to September 2025: 30+ activities, 14 partner universities, 10 countries, 5 programs in development.">
  <defs>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93233a"/>
      <stop offset="1" stop-color="#54101a"/>
    </linearGradient>
    <style>
      text { font-family: "Inter","Segoe UI","Helvetica Neue",Arial,"Sukhumvit Set","Sarabun",Tahoma,sans-serif; }
      .num2{font-size:52px;font-weight:800;fill:#d0691c}
      .lab2{font-size:18px;font-weight:700;fill:#7a1c2a}
      .th{font-size:14px;fill:#5a6b78}
      .hh{font-size:23px;font-weight:700;fill:#1a2530}
      .hv{font-size:40px;font-weight:800;fill:#d0691c}
      .hl{font-size:17px;font-weight:600;fill:#1a2530}
      .hls{font-size:15px;fill:#5a6b78}
      .ttl{font-size:37px;font-weight:800;fill:#fff}
      .sub{font-size:17px;fill:#f2dde1}
      .subth{font-size:14px;fill:#ddb9c1}
      .badge{font-size:24px;font-weight:800;fill:#fff}
      .pill{font-size:15px;font-weight:600;fill:#fff}
      .ribbon{font-size:16px;fill:#5a6b78}
      .foot{font-size:13px;fill:#5a6b78}
      .footr{font-size:13px;font-weight:600;fill:#7a1c2a}
    </style>
  </defs>

  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- header -->
  <rect width="1200" height="150" fill="url(#teal2)"/>
  <circle cx="95" cy="75" r="44" fill="#d0691c" stroke="#a8500f" stroke-width="2"/>
  <text x="95" y="84" text-anchor="middle" class="badge">SET</text>
  <text x="165" y="60" class="ttl">SET International Activity — 2025</text>
  <text x="165" y="90" class="sub">School of Engineering &amp; Technology · Walailak University</text>
  <text x="165" y="114" class="subth">สรุปกิจกรรมนานาชาติ · สำนักวิชาวิศวกรรมศาสตร์และเทคโนโลยี</text>
  <rect x="905" y="46" width="235" height="36" rx="18" fill="rgba(255,255,255,0.14)" stroke="#d0691c" stroke-width="1.5"/>
  <text x="1022" y="70" text-anchor="middle" class="pill">Oct 2024 – Sep 2025</text>

  <!-- stat tiles -->
  <g>
    <rect x="60"  y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="335" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="610" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>
    <rect x="885" y="192" width="255" height="158" rx="14" fill="#faf8fc" stroke="#e2e8f0"/>

    <text x="187"  y="272" text-anchor="middle" class="num2">30+</text>
    <text x="187"  y="306" text-anchor="middle" class="lab2">International activities</text>
    <text x="187"  y="330" text-anchor="middle" class="th">กิจกรรมนานาชาติ</text>

    <text x="462"  y="272" text-anchor="middle" class="num2">14</text>
    <text x="462"  y="306" text-anchor="middle" class="lab2">Partner universities</text>
    <text x="462"  y="330" text-anchor="middle" class="th">มหาวิทยาลัยพันธมิตร</text>

    <text x="737"  y="272" text-anchor="middle" class="num2">10</text>
    <text x="737"  y="306" text-anchor="middle" class="lab2">Countries engaged</text>
    <text x="737"  y="330" text-anchor="middle" class="th">ประเทศที่ร่วมมือ</text>

    <text x="1012" y="272" text-anchor="middle" class="num2">5</text>
    <text x="1012" y="306" text-anchor="middle" class="lab2">Programs in development</text>
    <text x="1012" y="330" text-anchor="middle" class="th">หลักสูตรที่กำลังพัฒนา</text>
  </g>

  <!-- highlights -->
  <text x="60" y="392" class="hh">Highlights of the year <tspan class="th" font-size="16"> ·  ไฮไลต์ประจำปี</tspan></text>

  <rect x="60"  y="410" width="525" height="128" rx="12" fill="#faf8fc" stroke="#e2e8f0"/>
  <rect x="615" y="410" width="525" height="128" rx="12" fill="#faf8fc" stroke="#e2e8f0"/>
  <rect x="60"  y="556" width="525" height="128" rx="12" fill="#faf8fc" stroke="#e2e8f0"/>
  <rect x="615" y="556" width="525" height="128" rx="12" fill="#faf8fc" stroke="#e2e8f0"/>

  <text x="90"  y="490" class="hv">14</text>
  <text x="178" y="466" class="hl">staff on the iLEARN network trip</text>
  <text x="178" y="494" class="hls">to Malaysia — UniMAP · UTM · UTHM</text>

  <text x="645" y="490" class="hv">3</text>
  <text x="710" y="466" class="hl">students on a year-long exchange</text>
  <text x="710" y="494" class="hls">at Harbin Engineering University, China</text>

  <text x="90"  y="636" class="hv">2</text>
  <text x="178" y="612" class="hl">Erasmus+ KA171 mobility programs</text>
  <text x="178" y="640" class="hls">agreed — Turkey · Slovakia</text>

  <text x="645" y="636" class="hv">55</text>
  <text x="710" y="612" class="hl">QS World Ranking academic</text>
  <text x="710" y="640" class="hls">contacts contributed</text>

  <!-- country ribbon -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="750" text-anchor="middle" class="ribbon">Engaged across: China · Taiwan · Japan · Malaysia · India · Turkey · Slovakia · France · United Kingdom · United States</text>

  <!-- footer -->
  <rect x="0" y="774" width="1200" height="56" fill="#faf8fc"/>
  <line x1="0" y1="774" x2="1200" y2="774" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="808" class="foot">Source: SET Internationalization Report · School of Engineering &amp; Technology, Walailak University</text>
  <text x="1140" y="808" text-anchor="end" class="footr">SET · Walailak University · Oct 2024 – Sep 2025</text>
</svg>
