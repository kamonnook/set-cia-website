<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="SET International at a glance: 40+ global partners, 120+ exchange students, 20+ countries across four regions.">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007a73"/>
      <stop offset="1" stop-color="#004e4a"/>
    </linearGradient>
    <style>
      text { font-family: "Inter","Segoe UI","Helvetica Neue",Arial,"Sukhumvit Set","Sarabun",Tahoma,sans-serif; }
      .num   { font-size: 60px; font-weight: 800; fill: #d4a437; }
      .lab   { font-size: 21px; font-weight: 700; fill: #006a64; }
      .th    { font-size: 15px; fill: #5a6b78; }
      .h2    { font-size: 23px; font-weight: 700; fill: #1a2530; }
      .reg   { font-size: 16px; font-weight: 600; fill: #1a2530; }
      .val   { font-size: 18px; font-weight: 700; fill: #006a64; }
      .ttl   { font-size: 38px; font-weight: 800; fill: #ffffff; }
      .sub   { font-size: 18px; fill: #cdeae7; }
      .subth { font-size: 15px; fill: #a9d6d2; }
      .badge { font-size: 26px; font-weight: 800; fill: #ffffff; }
      .ribbon{ font-size: 17px; fill: #5a6b78; }
      .foot  { font-size: 14px; fill: #5a6b78; }
      .footr { font-size: 14px; font-weight: 600; fill: #006a64; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- header band -->
  <rect width="1200" height="150" fill="url(#teal)"/>
  <!-- decorative globe -->
  <g stroke="#d4a437" stroke-width="1.5" fill="none" opacity="0.55">
    <circle cx="1110" cy="75" r="46"/>
    <ellipse cx="1110" cy="75" rx="18" ry="46"/>
    <line x1="1064" y1="75" x2="1156" y2="75"/>
    <line x1="1110" y1="29" x2="1110" y2="121"/>
  </g>
  <!-- CIA badge -->
  <circle cx="95" cy="75" r="44" fill="#d4a437" stroke="#b08a25" stroke-width="2"/>
  <text x="95" y="84" text-anchor="middle" class="badge">CIA</text>
  <!-- titles -->
  <text x="165" y="62" class="ttl">SET International — At a Glance</text>
  <text x="165" y="92" class="sub">School of Engineering &amp; Technology · Walailak University</text>
  <text x="165" y="116" class="subth">ภาพรวมความเป็นนานาชาติ · มหาวิทยาลัยวลัยลักษณ์</text>

  <!-- stat cards -->
  <g>
    <rect x="60"  y="195" width="320" height="150" rx="14" fill="#f7fafc" stroke="#e2e8f0"/>
    <rect x="440" y="195" width="320" height="150" rx="14" fill="#f7fafc" stroke="#e2e8f0"/>
    <rect x="820" y="195" width="320" height="150" rx="14" fill="#f7fafc" stroke="#e2e8f0"/>

    <text x="220" y="272" text-anchor="middle" class="num">40+</text>
    <text x="220" y="306" text-anchor="middle" class="lab">Global Partners</text>
    <text x="220" y="330" text-anchor="middle" class="th">พันธมิตรทั่วโลก</text>

    <text x="600" y="272" text-anchor="middle" class="num">120+</text>
    <text x="600" y="306" text-anchor="middle" class="lab">Exchange Students</text>
    <text x="600" y="330" text-anchor="middle" class="th">นักศึกษาแลกเปลี่ยน</text>

    <text x="980" y="272" text-anchor="middle" class="num">20+</text>
    <text x="980" y="306" text-anchor="middle" class="lab">Countries</text>
    <text x="980" y="330" text-anchor="middle" class="th">ประเทศ</text>
  </g>

  <!-- region bars -->
  <text x="60" y="398" class="h2">Partners by region <tspan class="th" font-size="16"> ·  พันธมิตรแยกตามภูมิภาค</tspan></text>

  <!-- Asia 24 (highlight gold) -->
  <text x="60" y="451" class="reg">Asia (เอเชีย)</text>
  <rect x="250" y="430" width="770" height="30" rx="6" fill="#d4a437"/>
  <text x="1034" y="451" class="val">24</text>

  <!-- Europe 9 -->
  <text x="60" y="499" class="reg">Europe (ยุโรป)</text>
  <rect x="250" y="478" width="289" height="30" rx="6" fill="#006a64"/>
  <text x="553" y="499" class="val">9</text>

  <!-- Oceania 4 -->
  <text x="60" y="547" class="reg">Oceania (โอเชียเนีย)</text>
  <rect x="250" y="526" width="128" height="30" rx="6" fill="#006a64"/>
  <text x="392" y="547" class="val">4</text>

  <!-- Americas 3 -->
  <text x="60" y="595" class="reg">Americas (อเมริกา)</text>
  <rect x="250" y="574" width="96" height="30" rx="6" fill="#006a64"/>
  <text x="360" y="595" class="val">3</text>

  <!-- country ribbon -->
  <line x1="60" y1="632" x2="1140" y2="632" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="668" text-anchor="middle" class="ribbon">Active partners in: China · Japan · Malaysia · Indonesia · Philippines · Taiwan · India · Germany · Austria — and more</text>

  <!-- footer -->
  <rect x="0" y="724" width="1200" height="76" fill="#f7fafc"/>
  <line x1="0" y1="724" x2="1200" y2="724" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="770" class="foot" font-style="italic">Illustrative example — replace figures with your confirmed data.</text>
  <text x="1140" y="770" text-anchor="end" class="footr">cia.set.wu.ac.th · Updated 2026</text>
</svg>
