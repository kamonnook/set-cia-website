<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="420" fill="#f7f6fb"/>
  <!-- soft brand blobs -->
  <circle cx="1350" cy="90" r="260" fill="#7a1c2a" opacity="0.06"/>
  <circle cx="1120" cy="360" r="200" fill="#d0691c" opacity="0.08"/>
  <circle cx="1540" cy="330" r="150" fill="#7a1c2a" opacity="0.05"/>
  <!-- flight arcs -->
  <g fill="none" stroke="#7a1c2a" stroke-width="2" opacity="0.22">
    <path d="M 820 330 Q 1080 60 1380 150"/>
    <path d="M 900 380 Q 1200 240 1520 300"/>
    <path d="M 1000 120 Q 1220 30 1500 80"/>
  </g>
  <g fill="none" stroke="#d0691c" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.7">
    <path d="M 860 300 Q 1120 90 1400 170"/>
  </g>
  <!-- network nodes -->
  <g fill="#7a1c2a" opacity="0.55">
    <circle cx="820" cy="330" r="5"/>
    <circle cx="1380" cy="150" r="5"/>
    <circle cx="900" cy="380" r="4"/>
    <circle cx="1520" cy="300" r="5"/>
    <circle cx="1000" cy="120" r="4"/>
    <circle cx="1500" cy="80" r="4"/>
  </g>
  <g fill="#d0691c" opacity="0.9">
    <circle cx="1180" cy="182" r="6"/>
    <circle cx="1258" cy="126" r="4"/>
    <circle cx="1100" cy="250" r="4"/>
  </g>
  <!-- paper plane on the gold arc -->
  <g transform="translate(1400,170) rotate(18)" fill="#7a1c2a" opacity="0.85">
    <path d="M0 0 L-26 -7 L-20 0 L-26 7 Z"/>
  </g>
</svg>
